name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, '🚀 chore(release)') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      released: ${{ steps.commit.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install vampus
        run: cargo install vampus --git https://github.com/atareao/vampus

      - name: Determine bump type from commits
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD | head -1)
          COMMITS=$(git log "$LAST_TAG"..HEAD --format="%s")
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|!:"; then
            echo "type=--major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE "feat(\(|:|!)"; then
            echo "type=--minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=--patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version with vampus
        run: vampus upgrade ${{ steps.bump.outputs.type }}

      - name: Get new version
        id: version
        run: |
          V=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Sync Cargo.lock
        run: cargo check --quiet

      - name: Generate changelog
        run: git-cliff -o CHANGELOG.md --tag "v${{ steps.version.outputs.value }}"

      - name: Commit, tag and push
        id: commit
        run: |
          V="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🚀 chore(release): v${V}"
          git tag "v${V}"
          git push origin HEAD:main
          git push origin "v${V}"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Sync development with main
        run: git push origin HEAD:development

  build:
    needs: [prepare]
    if: needs.prepare.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare archive
        shell: bash
        run: |
          PKG="llm-gateway-${{ matrix.target }}"
          tar czf "$PKG.tar.gz" -C "target/${{ matrix.target }}/release" llm-gateway
          echo "ARTIFACT=$PKG.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-gateway-${{ matrix.target }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: llm-gateway-*
          merge-multiple: true

      - name: Extract changelog section
        run: |
          V="${{ needs.prepare.outputs.version }}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release v${V}" > release-notes.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: "*.tar.gz"
          fail_on_unmatched_files: true

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io (si hay token)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Sin CARGO_REGISTRY_TOKEN; se omite la publicación en crates.io."
            exit 0
          fi
          cargo publish --allow-dirty
