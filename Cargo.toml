[package]
name = "llm-gateway-rs"
version = "0.5.0"
edition = "2024"
autobins = false
description = "Gateway proxy OpenAI-compatible con failover y keep-alive (warmup) de backends."
license = "MIT"
repository = "https://github.com/atareao/llm-gateway"
readme = "README.md"
keywords = ["llm", "gateway", "proxy", "openai", "ai"]
categories = ["web-programming::http-server"]

[[bin]]
name = "llm-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
httpdate = "1"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "metrics", "logs", "trace"] }
opentelemetry-prometheus = "0.33"
prometheus = "0.14"
tracing-opentelemetry = "0.34"
opentelemetry-appender-tracing = "0.33"
opentelemetry-http = "0.33"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
http-body-util = "0.1"
futures-util = "0.3"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "metrics", "logs", "trace"] }
prost = "0.14"
