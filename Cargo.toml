[package]
name = "llm-gateway-rs"
version = "0.3.2"
edition = "2024"
autobins = false
description = "Gateway proxy OpenAI-compatible con failover y keep-alive (warmup) de backends."
license = "MIT"
repository = "https://github.com/atareao/llm-gateway"
readme = "README.md"
keywords = ["llm", "gateway", "proxy", "openai", "ai"]
categories = ["web-programming::http-server"]

[[bin]]
name = "llm-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
http-body-util = "0.1"
futures-util = "0.3"
